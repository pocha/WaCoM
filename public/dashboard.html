<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dashboard - WaCoM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/theme.css"/>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col">

<nav class="bg-surface border-b border-outline-variant shadow-sm flex justify-between items-center w-full px-gutter py-2 sticky top-0 z-50">
  <a href="/" class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-lg bg-primary-container flex items-center justify-center text-on-primary-container">
      <span class="material-symbols-outlined">groups</span>
    </div>
    <span class="font-headline-md text-headline-md font-bold text-primary">WaCoM</span>
  </a>
  <button id="logoutBtn" class="hidden font-label-md text-label-md text-on-surface-variant hover:text-error transition-colors">Log out</button>
</nav>

<main class="flex-1 w-full px-gutter md:px-24 py-10">
  <div class="max-w-3xl mx-auto">
    <h1 class="font-headline-lg text-headline-lg text-on-surface mb-1">Your Communities</h1>
    <p class="text-on-surface-variant font-body-md mb-8">Communities your WhatsApp account participates in, via Watobot.</p>

    <div id="loadingState" class="text-on-surface-variant font-body-md">Loading…</div>
    <div id="emptyState" class="hidden text-on-surface-variant font-body-md">No communities found for this WhatsApp account.</div>
    <div id="errorState" class="hidden text-error font-body-md"></div>
    <div id="communityList" class="flex flex-col gap-4"></div>
  </div>
</main>

<!-- Login Modal -->
<div class="fixed inset-0 z-[100] hidden flex items-center justify-center px-4" id="loginModal">
  <div class="modal-overlay absolute inset-0"></div>
  <div class="bg-surface-container-lowest w-full max-w-md rounded-xl p-8 whatsapp-shadow relative z-10 border border-outline-variant">
    <h3 class="font-headline-md text-headline-md text-on-surface mb-2">Connect Watobot</h3>
    <p class="text-on-surface-variant font-body-md mb-6">Paste your <strong>permanent</strong> Watobot API key to sign in. Generate one from your <a href="https://watobot.xyz" target="_blank" rel="noopener" class="text-primary underline">Watobot dashboard</a>.</p>
    <form id="apiKeyForm" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label class="font-label-md text-label-md text-on-surface-variant">Watobot API Key</label>
        <input id="apiKeyInput" class="bg-surface-container-low border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-lg p-3 transition-all outline-none font-mono text-sm" placeholder="64-character key" required/>
      </div>
      <div id="loginMessage" class="min-h-[20px] text-sm"></div>
      <button id="loginSubmitBtn" type="submit" class="bg-primary-container text-on-primary-container font-bold py-4 rounded-xl hover:opacity-90 active:scale-95 transition-all">Sign In</button>
    </form>
  </div>
</div>

<script type="module">
  import {onAuthReady, signInWithApiKey, logOut, call} from "/assets/wacom.js";

  const loginModal = document.getElementById('loginModal');
  const logoutBtn = document.getElementById('logoutBtn');
  const apiKeyForm = document.getElementById('apiKeyForm');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const loginSubmitBtn = document.getElementById('loginSubmitBtn');
  const loginMessage = document.getElementById('loginMessage');

  const loadingState = document.getElementById('loadingState');
  const emptyState = document.getElementById('emptyState');
  const errorState = document.getElementById('errorState');
  const communityList = document.getElementById('communityList');

  const listMyCommunities = call('listMyCommunities');
  const onboardCommunity = call('onboardCommunity');

  onAuthReady((user) => {
    if (!user) {
      loginModal.classList.remove('hidden');
      logoutBtn.classList.add('hidden');
      return;
    }
    loginModal.classList.add('hidden');
    logoutBtn.classList.remove('hidden');
    loadCommunities();
  });

  logoutBtn.addEventListener('click', () => logOut());

  apiKeyForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) return;
    loginSubmitBtn.disabled = true;
    loginSubmitBtn.textContent = 'Signing in…';
    loginMessage.textContent = '';
    loginMessage.className = 'min-h-[20px] text-sm';
    try {
      await signInWithApiKey(apiKey);
    } catch (err) {
      loginMessage.textContent = err.message || 'Sign in failed. Check your API key and try again.';
      loginMessage.className = 'min-h-[20px] text-sm text-error';
    } finally {
      loginSubmitBtn.disabled = false;
      loginSubmitBtn.textContent = 'Sign In';
    }
  });

  async function loadCommunities() {
    loadingState.classList.remove('hidden');
    emptyState.classList.add('hidden');
    errorState.classList.add('hidden');
    communityList.innerHTML = '';
    try {
      const {communities} = await listMyCommunities();
      loadingState.classList.add('hidden');
      if (!communities.length) {
        emptyState.classList.remove('hidden');
        return;
      }
      communities.forEach((c) => communityList.appendChild(renderCommunityRow(c)));
    } catch (err) {
      loadingState.classList.add('hidden');
      errorState.textContent = err.message || 'Failed to load communities.';
      errorState.classList.remove('hidden');
    }
  }

  function renderCommunityRow(community) {
    const row = document.createElement('div');
    row.className = 'card p-5 flex items-center justify-between gap-4';

    const info = document.createElement('div');
    info.innerHTML = `
      <p class="font-headline-md text-headline-md">${escapeHtml(community.name)}</p>
      <p class="text-muted-sm">${community.onboarded ? 'Onboarded' : 'Not onboarded yet'}</p>
    `;
    row.appendChild(info);

    const action = document.createElement('div');
    if (community.onboarded) {
      const link = document.createElement('a');
      link.href = `/community.html?id=${encodeURIComponent(community.id)}`;
      link.className = 'font-label-md text-label-md bg-primary-container text-on-primary-container px-5 py-2 rounded-xl font-bold hover:opacity-90 transition-all';
      link.textContent = 'Manage';
      action.appendChild(link);
    } else {
      const btn = document.createElement('button');
      btn.className = 'font-label-md text-label-md border border-primary text-primary px-5 py-2 rounded-xl font-bold hover:bg-primary-container/20 transition-all';
      btn.textContent = 'Onboard';
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Onboarding…';
        try {
          await onboardCommunity({communityJid: community.id});
          await loadCommunities();
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Onboard';
          alert(err.message || 'Onboarding failed — are you an admin of this community?');
        }
      });
      action.appendChild(btn);
    }
    row.appendChild(action);
    return row;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
