<!--#var title="Manage Community - Watomod"-->
<!--#include partial="head-nav"-->
      <div class="flex items-center gap-4 mb-1">
        <img id="communityPicture" src="/assets/logo-icon.png" class="w-14 h-14 rounded-full object-cover flex-shrink-0"/>
        <h1 class="font-headline-lg text-headline-lg text-on-surface" id="communityName">Community</h1>
      </div>

      <div class="flex gap-1 border-b border-outline-variant mb-6 mt-6">
        <a href="#" class="px-4 py-3 font-label-md text-label-md font-bold text-primary border-b-2 border-primary">Gatekeeping</a>
        <span class="px-4 py-3 font-label-md text-label-md text-on-surface-variant/50 cursor-not-allowed" title="Coming soon">Inactive Members</span>
      </div>

      <section class="card p-6 mb-8">
        <h2 class="font-headline-md text-headline-md mb-4">Community Rules</h2>
        <textarea id="communityRulesInput" rows="5" placeholder="e.g. Be respectful, no spam, introduce yourself when you join…" class="w-full bg-surface-container-low border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-lg p-3 outline-none mb-3"></textarea>
        <div id="rulesMessage" class="min-h-[20px] text-sm mb-2"></div>
        <button id="saveRulesBtn" class="border border-primary text-primary font-bold px-6 py-3 rounded-xl hover:bg-primary-container/20 transition-all">Save Rules</button>
        <p class="text-muted-sm mt-2">Shown to applicants on the application form.</p>
      </section>

      <section class="card p-6">
        <div class="flex items-center justify-between mb-1">
          <h2 class="font-headline-md text-headline-md">Application Form</h2>
          <a id="previewFormLink" href="#" target="_blank" rel="noopener" class="hidden font-label-md text-label-md text-primary font-bold flex-shrink-0">Preview</a>
        </div>
        <p class="text-muted-sm mb-4">Every applicant is always asked for their phone number — no need to add that as a question.</p>
        <div id="questionRows" class="flex flex-col gap-3 mb-4"></div>
        <button id="addQuestionBtn" type="button" class="text-primary font-bold font-body-md mb-4">+ Add question</button>
        <div id="formMessage" class="min-h-[20px] text-sm mb-2"></div>
        <button id="saveFormBtn" class="bg-primary-container text-on-primary-container font-bold px-6 py-3 rounded-xl hover:opacity-90 transition-all">Save Form to Preview</button>
      </section>

      <section class="mt-8">
        <h2 class="font-headline-md text-headline-md mb-4">Applicants</h2>
        <div id="applicantsLoading" class="text-on-surface-variant font-body-md">Loading…</div>
        <div id="applicantsEmpty" class="hidden text-on-surface-variant font-body-md">No applications yet.</div>
        <div id="applicantList" class="flex flex-col gap-3"></div>
      </section>

<!--#include partial="footer"-->
<script type="module">
  import {auth, onAuthReady, db, getOwnMod, watobotFetch} from "/assets/wacom.js";
  import {
    collection, doc, getDoc, getDocs, query, where, orderBy, onSnapshot, limit,
    writeBatch, updateDoc, serverTimestamp,
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const communityJid = new URLSearchParams(location.search).get('communityId') || '';
  if (!communityJid) {
    location.href = '/dashboard';
  }

  let currentFormId = null;
  let community = null;

  onAuthReady((user) => {
    if (!user) {
      location.href = '/dashboard';
      return;
    }
    loadCommunityInfo();
    loadActiveForm();
    listenApplicants();
  });

  async function loadCommunityInfo() {
    const snap = await getDoc(doc(db, 'Communities', communityJid));
    if (snap.exists()) {
      community = snap.data();
      document.getElementById('communityName').textContent = community.name;
      document.title = `${community.name} - Watomod`;
      if (community.pictureUrl) {
        document.getElementById('communityPicture').src = community.pictureUrl;
      }
      document.getElementById('communityRulesInput').value = community.rules || '';
    } else {
      document.getElementById('communityName').textContent = communityJid;
    }
  }

  document.getElementById('saveRulesBtn').addEventListener('click', async () => {
    const msg = document.getElementById('rulesMessage');
    const rules = document.getElementById('communityRulesInput').value.trim();
    msg.textContent = 'Saving…';
    msg.className = 'min-h-[20px] text-sm text-on-surface-variant';
    try {
      await updateDoc(doc(db, 'Communities', communityJid), {rules});
      community = {...(community || {}), rules};
      // The public form page reads Forms/{formId}, not Communities/{jid}
      // (it can't — that doc is mod-only) — so the active form's own
      // snapshot has to be kept in sync too, or a rules edit would only
      // show up next time the form itself is saved.
      if (currentFormId) {
        await updateDoc(doc(db, 'Communities', communityJid, 'Forms', currentFormId), {communityRules: rules});
      }
      msg.textContent = 'Saved.';
      msg.className = 'min-h-[20px] text-sm text-primary';
    } catch (err) {
      msg.textContent = err.message || 'Failed to save rules.';
      msg.className = 'min-h-[20px] text-sm text-error';
    }
  });

  async function loadActiveForm() {
    const formsRef = collection(db, 'Communities', communityJid, 'Forms');
    const q = query(formsRef, where('active', '==', true), limit(1));
    const snap = await getDocs(q);
    if (snap.empty) {
      renderQuestionRows([{label: '', required: true}]);
      return;
    }
    const formDoc = snap.docs[0];
    currentFormId = formDoc.id;
    renderQuestionRows(formDoc.data().questions);
    showFormLink(formDoc.id);
  }

  function showFormLink(formId) {
    const link = `${location.origin}/community/form?c=${encodeURIComponent(communityJid)}&f=${encodeURIComponent(formId)}`;
    const previewLink = document.getElementById('previewFormLink');
    previewLink.href = link;
    previewLink.classList.remove('hidden');
  }

  const questionRows = document.getElementById('questionRows');

  function renderQuestionRows(questions) {
    questionRows.innerHTML = '';
    questions.forEach(addQuestionRow);
  }

  function addQuestionRow(q = {label: '', required: true}) {
    const row = document.createElement('div');
    row.className = 'flex items-center gap-3';
    row.innerHTML = `
      <input class="flex-1 bg-surface-container-low border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-lg p-3 outline-none question-label" placeholder="Question" value="${escapeAttr(q.label)}"/>
      <label class="flex items-center gap-1 text-sm text-on-surface-variant flex-shrink-0">
        <input type="checkbox" class="question-required" ${q.required ? 'checked' : ''}/> Required
      </label>
      <button type="button" class="text-error flex-shrink-0 remove-question">
        <span class="material-symbols-outlined text-[20px]">delete</span>
      </button>
    `;
    row.querySelector('.remove-question').addEventListener('click', () => row.remove());
    questionRows.appendChild(row);
  }

  document.getElementById('addQuestionBtn').addEventListener('click', () => addQuestionRow());

  document.getElementById('saveFormBtn').addEventListener('click', async () => {
    const rows = [...questionRows.querySelectorAll(':scope > div')];
    const questions = rows.map((row, i) => ({
      id: `q${i}`,
      label: row.querySelector('.question-label').value.trim(),
      required: row.querySelector('.question-required').checked,
    })).filter((q) => q.label);

    const msg = document.getElementById('formMessage');
    if (!questions.length) {
      msg.textContent = 'Add at least one question.';
      msg.className = 'min-h-[20px] text-sm text-error';
      return;
    }
    msg.textContent = 'Saving…';
    msg.className = 'min-h-[20px] text-sm text-on-surface-variant';
    try {
      const formsRef = collection(db, 'Communities', communityJid, 'Forms');
      // Only one active form per community at a time — deactivate any others.
      const activeSnap = await getDocs(query(formsRef, where('active', '==', true)));
      const batch = writeBatch(db);
      activeSnap.forEach((d) => batch.update(d.ref, {active: false}));
      const newFormRef = doc(formsRef);
      batch.set(newFormRef, {
        communityName: community?.name ?? communityJid,
        communityPictureUrl: community?.pictureUrl ?? null,
        communityRules: community?.rules ?? '',
        questions,
        active: true,
        created_by: auth.currentUser.uid,
        created_at: serverTimestamp(),
      });
      await batch.commit();
      currentFormId = newFormRef.id;
      showFormLink(newFormRef.id);
      msg.textContent = 'Saved.';
      msg.className = 'min-h-[20px] text-sm text-primary';
    } catch (err) {
      msg.textContent = err.message || 'Failed to save form.';
      msg.className = 'min-h-[20px] text-sm text-error';
    }
  });

  function listenApplicants() {
    const applicantsRef = collection(db, 'Communities', communityJid, 'Applicants');
    const q = query(applicantsRef, orderBy('applied_at', 'desc'));
    onSnapshot(q, (snap) => {
      document.getElementById('applicantsLoading').classList.add('hidden');
      const list = document.getElementById('applicantList');
      const empty = document.getElementById('applicantsEmpty');
      list.innerHTML = '';
      if (snap.empty) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      snap.forEach((docSnap) => list.appendChild(renderApplicant(docSnap.id, docSnap.data())));
    }, (err) => {
      document.getElementById('applicantsLoading').classList.add('hidden');
      const list = document.getElementById('applicantList');
      list.innerHTML = `<p class="text-error font-body-md">${escapeAttr(err.message)}</p>`;
    });
  }

  const STATUS_LABELS = {
    applied: 'Pending review',
    rejected: 'Rejected',
    pending_join: 'Invited — awaiting join',
    joined: 'Joined',
  };

  function renderApplicant(id, applicant) {
    const card = document.createElement('div');
    card.className = 'card p-5 flex flex-col gap-3';

    const questions = applicant.questions || Object.keys(applicant.answers || {}).map((qid) => ({id: qid, label: qid}));
    const answersHtml = questions.map((q) => {
      const answer = (applicant.answers || {})[q.id] || '';
      return `<p class="text-sm"><span class="text-muted">Q: ${escapeAttr(q.label)}</span><br/>A: ${escapeAttr(answer)}</p>`;
    }).join('');

    card.innerHTML = `
      <div class="flex items-center justify-between">
        <p class="font-headline-md text-headline-md">${escapeAttr(applicant.phone)}</p>
        <span class="label-muted">${STATUS_LABELS[applicant.status] || applicant.status}</span>
      </div>
      <div class="flex flex-col gap-2">${answersHtml}</div>
      <div class="flex flex-col gap-2 actions"></div>
      <details class="text-sm">
        <summary class="text-muted cursor-pointer select-none">History</summary>
        <div class="flex flex-col gap-1 mt-2 text-muted-sm">${renderHistory(applicant)}</div>
      </details>
    `;

    if (applicant.status === 'applied') {
      const actions = card.querySelector('.actions');
      const buttonRow = document.createElement('div');
      buttonRow.className = 'flex gap-3';
      const errorMsg = document.createElement('p');
      errorMsg.className = 'hidden text-error text-sm';

      const approveBtn = document.createElement('button');
      approveBtn.className = 'bg-primary-container text-on-primary-container font-bold px-5 py-2 rounded-xl hover:opacity-90 transition-all disabled:opacity-60';
      approveBtn.textContent = 'Approve';

      const rejectBtn = document.createElement('button');
      rejectBtn.className = 'border border-error text-error font-bold px-5 py-2 rounded-xl hover:bg-error-container/30 transition-all disabled:opacity-60';
      rejectBtn.textContent = 'Reject';

      approveBtn.addEventListener('click', async () => {
        approveBtn.disabled = true;
        rejectBtn.disabled = true;
        errorMsg.classList.add('hidden');
        approveBtn.textContent = 'Approving…';
        try {
          if (!community?.inviteLink) {
            throw new Error('No invite link cached for this community — click "Load All My Communities" on the dashboard to refresh it.');
          }
          const mod = await getOwnMod();
          const message = `You've been approved to join "${community?.name ?? communityJid}"! Tap to join: ${community.inviteLink}\n\n` +
            "Note: this invite link is shared by everyone, so clicking it first puts you in a pending-approval queue for the community. " +
            "An automatic check runs every hour and lets you in once it confirms your approval — no further action needed on your end.";
          await watobotFetch(mod.api_key, '/api/message', {
            method: 'POST',
            body: JSON.stringify({to: applicant.phone, message}),
          });
          await updateDoc(doc(db, 'Communities', communityJid, 'Applicants', id), {
            status: 'pending_join',
            approved_by: auth.currentUser.uid,
            approved_by_name: mod.name,
            invited_at: serverTimestamp(),
          });
          buttonRow.remove();
        } catch (err) {
          approveBtn.disabled = false;
          rejectBtn.disabled = false;
          approveBtn.textContent = 'Approve';
          errorMsg.textContent = err.message || 'Failed to approve. Please try again.';
          errorMsg.classList.remove('hidden');
        }
      });

      rejectBtn.addEventListener('click', async () => {
        approveBtn.disabled = true;
        rejectBtn.disabled = true;
        errorMsg.classList.add('hidden');
        rejectBtn.textContent = 'Rejecting…';
        try {
          const mod = await getOwnMod();
          await updateDoc(doc(db, 'Communities', communityJid, 'Applicants', id), {
            status: 'rejected',
            rejected_by: auth.currentUser.uid,
            rejected_by_name: mod.name,
            rejected_at: serverTimestamp(),
          });
          buttonRow.remove();
        } catch (err) {
          approveBtn.disabled = false;
          rejectBtn.disabled = false;
          rejectBtn.textContent = 'Reject';
          errorMsg.textContent = err.message || 'Failed to reject. Please try again.';
          errorMsg.classList.remove('hidden');
        }
      });

      buttonRow.append(approveBtn, rejectBtn);
      actions.append(buttonRow, errorMsg);
    }

    return card;
  }

  function renderHistory(applicant) {
    const lines = [];
    if (applicant.applied_at) lines.push(`Applied: ${formatTimestamp(applicant.applied_at)}`);
    if (applicant.status === 'rejected' && applicant.rejected_at) {
      lines.push(`Rejected by ${escapeAttr(applicant.rejected_by_name || 'a mod')}: ${formatTimestamp(applicant.rejected_at)}`);
    }
    if (applicant.invited_at) {
      lines.push(`Approved by ${escapeAttr(applicant.approved_by_name || 'a mod')}: ${formatTimestamp(applicant.invited_at)}`);
    }
    if (applicant.joined_at) lines.push(`Joined: ${formatTimestamp(applicant.joined_at)}`);
    return lines.map((l) => `<p>${l}</p>`).join('') || '<p>No history yet.</p>';
  }

  function formatTimestamp(ts) {
    if (!ts || typeof ts.toDate !== 'function') return '—';
    return ts.toDate().toLocaleString();
  }

  function escapeAttr(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }
</script>
</body>
</html>
